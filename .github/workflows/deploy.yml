name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # DevKit's release workflow publishes here; the site lists releases and links
  # the newest download, so every published, edited, or deleted release rebuilds it.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

# One deploy at a time. A backfill publishes several releases in a row; the
# queued deploy that runs last reads every one of them. A release event only
# hands off (below), so it stays out of the queue and cannot be cancelled
# while waiting in it.
concurrency:
  group: ${{ github.event_name == 'release' && format('release-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A release event runs on the release's tag, and the github-pages
  # environment only accepts deploys from main. Start this workflow again on
  # main instead -- workflow_dispatch is the one event the built-in token may
  # trigger.
  redeploy-from-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      # src/data/releases.ts reads the release list from the GitHub API.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
